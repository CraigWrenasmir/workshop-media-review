<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Supports that travel</title><desc>R is the existing composite example, not an identifiable student. Strengths, interests, communication and demand/support content are adapted from the supplied guide; the questions are newly proposed.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">Supports that travel</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">R · age 14 · Year 9 · composite example from the supplied guide</text><rect x="48" y="205" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="70" y="244" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">Strengths</text><text x="70" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">Deep knowledge of interests;</text><text x="70" y="321" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">excellent memory; clear writing</text><text x="70" y="355" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">when the task is explicit.</text><rect x="616" y="205" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="638" y="244" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">Interests</text><text x="638" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">Flight and aircraft design;</text><text x="638" y="321" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">drawing comics; building game</text><text x="638" y="355" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">worlds with two friends.</text><rect x="48" y="402" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="70" y="441" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">Communication</text><text x="70" y="484" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">Time to answer; concrete wording;</text><text x="70" y="518" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">written instructions R can return</text><text x="70" y="552" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">to.</text><rect x="616" y="402" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="638" y="441" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">What adds demand</text><text x="638" y="484" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">Crowded corridors; six teachers;</text><text x="638" y="518" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">unclear task sheets; unexpected</text><text x="638" y="552" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">group work.</text><rect x="48" y="599" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="70" y="638" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">What helps</text><text x="70" y="681" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">Library at lunch; art room; a</text><text x="70" y="715" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">quiet check-in; the plan in</text><text x="70" y="749" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">advance; one known peer.</text><rect x="616" y="599" width="536" height="175" rx="10" fill="#f1edf8" stroke="none"/><text x="638" y="638" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#584099">Questions to check</text><text x="638" y="681" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">What should travel across</text><text x="638" y="715" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">subjects? Who should see it? What</text><text x="638" y="749" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#252233">would R change?</text><text x="48" y="845" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#655e72">Condensed source content; questions and layout are proposed, not student-approved.</text><text x="48" y="875" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#655e72">Illustrative workshop material · No real student record or stock photograph</text></svg>