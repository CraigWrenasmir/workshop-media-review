<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>A checklist for the school day</title><desc>New proposed secondary routine checklist. It is not a student-approved routine or a school policy.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">A checklist for the school day</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">Secondary example · literal text; agree wording and supports with the student</text><rect x="48" y="212" width="1104" height="100" rx="10" fill="#f1edf8" stroke="none"/><rect x="70" y="242" width="37" height="37" rx="10" fill="white" stroke="#584099"/><text x="139" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#584099">Check the day</text><text x="139" y="288" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Timetable, room changes and the materials each subject needs.</text><rect x="48" y="327" width="1104" height="100" rx="10" fill="#f1edf8" stroke="none"/><rect x="70" y="357" width="37" height="37" rx="10" fill="white" stroke="#584099"/><text x="139" y="365" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#584099">Check the work</text><text x="139" y="403" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Assignment list, deadlines and what the next step is.</text><rect x="48" y="442" width="1104" height="100" rx="10" fill="#f1edf8" stroke="none"/><rect x="70" y="472" width="37" height="37" rx="10" fill="white" stroke="#584099"/><text x="139" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#584099">Pack the essentials</text><text x="139" y="518" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Learning materials, water and the agreed supports you use.</text><rect x="48" y="557" width="1104" height="100" rx="10" fill="#f1edf8" stroke="none"/><rect x="70" y="587" width="37" height="37" rx="10" fill="white" stroke="#584099"/><text x="139" y="595" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#584099">Plan a break</text><text x="139" y="633" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Know where you can go and how you can ask for a break.</text><rect x="48" y="672" width="1104" height="100" rx="10" fill="#f1edf8" stroke="none"/><rect x="70" y="702" width="37" height="37" rx="10" fill="white" stroke="#584099"/><text x="139" y="710" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#584099">Check the journey</text><text x="139" y="748" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Travel card or pickup plan; where to go at the end of the day.</text><text x="48" y="845" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#655e72">New illustrative checklist; adapt it to the student and the school’s arrangements.</text><text x="48" y="875" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#655e72">Illustrative workshop material · No real student record or stock photograph</text></svg>