<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Year 9 History · task map</title><desc>Task title, topic options, two Week 5 library lessons and Week 7 Friday 9 am deadline come from the supplied guide. The six-step structure is a new proposal; equivalent formats must be agreed with the teacher.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">Year 9 History · task map</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">The Industrial Revolution and everyday life</text><rect x="48" y="196" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="228" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">1  Choose a focus</text><text x="350" y="230" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Work, housing, health or childhood. Confirm the</text><text x="350" y="262" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">question with your teacher.</text><rect x="48" y="297" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="329" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">2  Confirm the format</text><text x="350" y="331" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Agree what your final response needs to include.</text><text x="350" y="363" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Confirm any equivalent format.</text><rect x="48" y="398" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="430" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">3  Gather sources</text><text x="350" y="432" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Use the two Week 5 library lessons. Record where</text><text x="350" y="464" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">each useful source comes from.</text><rect x="48" y="499" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="531" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">4  Plan the response</text><text x="350" y="533" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Group evidence around your question. Check how much</text><text x="350" y="565" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">detail is needed.</text><rect x="48" y="600" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="632" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">5  Check a draft</text><text x="350" y="634" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">You may show your teacher a draft. Agree a helpful</text><text x="350" y="666" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">check-in time.</text><rect x="48" y="701" width="1104" height="91" rx="10" fill="#f3f0f8" stroke="none"/><text x="70" y="733" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#584099">6  Submit</text><text x="350" y="735" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">Week 7 · Friday · 9:00 am · online. Check that your</text><text x="350" y="767" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#252233">file was received.</text><text x="48" y="845" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#655e72">Proposed redesign of the supplied task. Intermediate steps are illustrative.</text><text x="48" y="875" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#655e72">Illustrative workshop material · No real student record or stock photograph</text></svg>