<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Adjustment review record</title><desc>Illustrative record drafted for this shortlist. No completed consultation, outcome or compliance claim is implied.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">Adjustment review record</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">Proposed example; agree the details before using it in a workshop</text><rect x="48" y="202" width="1104" height="84" rx="10" fill="#f4f1f8" stroke="none"/><text x="68" y="234" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Student / context</text><text x="365" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">R · Year 9 · composite example; History research</text><text x="365" y="266" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">task</text><rect x="48" y="298" width="1104" height="84" rx="10" fill="#faf9fc" stroke="none"/><text x="68" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Access question</text><text x="365" y="331" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Does a written task map help R start and plan the</text><text x="365" y="362" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">work?</text><rect x="48" y="394" width="1104" height="84" rx="10" fill="#f4f1f8" stroke="none"/><text x="68" y="426" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Proposed support</text><text x="365" y="427" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Clear written instructions, agreed checkpoints</text><text x="365" y="458" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">and a quiet check-in</text><rect x="48" y="490" width="1104" height="84" rx="10" fill="#faf9fc" stroke="none"/><text x="68" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Student input to seek</text><text x="365" y="523" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Preferred format; useful check-in time; what adds</text><text x="365" y="554" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">demand</text><rect x="48" y="586" width="1104" height="84" rx="10" fill="#f4f1f8" stroke="none"/><text x="68" y="618" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Evidence to collect</text><text x="365" y="619" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Student feedback, task-start progress and whether</text><text x="365" y="650" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">support is useful</text><rect x="48" y="682" width="1104" height="84" rx="10" fill="#faf9fc" stroke="none"/><text x="68" y="714" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#252233">Review</text><text x="365" y="715" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Agree a review date and responsible staff member</text><text x="365" y="746" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">with the student</text><text x="48" y="845" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#655e72">New proposed layout; example context draws on the supplied composite R.</text><text x="48" y="875" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#655e72">Illustrative workshop material · No real student record or stock photograph</text></svg>