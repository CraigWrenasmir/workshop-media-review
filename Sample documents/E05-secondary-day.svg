<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>A Thursday · Year 9</title><desc>Faithful condensed visual version of the supplied Session 3 Sample Year 9 Thursday timetable. Clock times are consistently shown in 24-hour format. This is not an actual school timetable.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">A Thursday · Year 9</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">Condensed timetable from the supplied secondary Participant Guide</text><rect x="48" y="194" width="1104" height="50" rx="10" fill="#584099" stroke="none"/><text x="65" y="227" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">Time</text><text x="205" y="227" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">Subject / place</text><text x="572" y="227" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">What is happening today</text><rect x="48" y="248" width="1104" height="47" rx="10" fill="#f0ecf7" stroke="none"/><text x="65" y="279" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">8:30</text><text x="205" y="279" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">Before school</text><text x="572" y="279" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#252233">Locker bay, yard or library</text><rect x="48" y="298" width="1104" height="47" rx="10" fill="#faf9fc" stroke="none"/><text x="65" y="329" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#252233">8:45</text><text x="205" y="32