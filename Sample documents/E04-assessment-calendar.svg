<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Assessment timeline</title><desc>The calendar condenses the timing of the supplied Year 9 History task. Week 6 is explicitly an illustrative draft-check suggestion.</desc><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="14" rx="10" fill="#584099" stroke="none"/><text x="48" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#584099">SAMPLE DOCUMENT · FOR REVIEW</text><text x="48" y="118" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#252233">Assessment timeline</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655e72">Year 9 History · one task made visible across the weeks</text><rect x="48" y="245" width="208" height="363" rx="10" fill="#ede7f6" stroke="none"/><text x="66" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#584099">Week 3</text><text x="66" y="366" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Thursday</text><text x="66" y="471" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Task handed</text><text x="66" y="508" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">out</text><rect x="272" y="245" width="208" height="363" rx="10" fill="#ede7f6" stroke="none"/><text x="290" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#584099">Week 4</text><text x="290" y="366" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Monday</text><text x="290" y="471" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Task sheet</text><text x="290" y="508" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">online</text><rect x="496" y="245" width="208" height="363" rx="10" fill="#ede7f6" stroke="none"/><text x="514" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#584099">Week 5</text><text x="514" y="366" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">2 library</text><text x="514" y="403" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">lessons</text><text x="514" y="471" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Gather</text><text x="514" y="508" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">sources</text><rect x="720" y="245" width="208" height="363" rx="10" fill="#ede7f6" stroke="none"/><text x="738" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#584099">Week 6</text><text x="738" y="366" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Optional</text><text x="738" y="403" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">check-in</text><text x="738" y="471" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Agree draft</text><text x="738" y="508" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">time</text><rect x="944" y="245" width="208" height="363" rx="10" fill="#ede7f6" stroke="none"/><text x="962" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#584099">Week 7</text><text x="962" y="366" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Friday ·</text><text x="962" y="403" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">9:00 am</text><text x="962" y="471" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">Submit</text><text x="962" y="508" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#252233">online</text><text x="48" y="681" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#